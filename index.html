<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chhaati — your pocket gym coach</title>
<meta name="description" content="chhaati (छाती = chest): a beginner-friendly gym tracker. Learn exercises with animated demos, remember your weights, hit your goals.">
<meta name="theme-color" content="#0b0b0f">
<script>
/* set theme before first paint to avoid flash */
try {
  var t = localStorage.getItem("gymlog.theme") || "dark";
  document.documentElement.setAttribute("data-theme", t);
  if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f2f3f5");
} catch (e) {}
</script>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg viewBox="0 0 128 128" width="21" height="21" aria-hidden="true">
        <path fill="var(--accent)" d="M34 40 H58 Q62 40 62 44 V72 Q62 84 50 84 H44 Q26 84 26 62 V48 Q26 40 34 40 Z"/>
        <path fill="var(--accent)" d="M94 40 H70 Q66 40 66 44 V72 Q66 84 78 84 H84 Q102 84 102 62 V48 Q102 40 94 40 Z"/>
      </svg>
      CHHAATI<span class="dot">.</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-timer" title="Rest timer" aria-label="Rest timer">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M9 2h6"/></svg>
      </button>
      <button class="icon-btn" id="btn-theme" title="Toggle theme" aria-label="Toggle theme">
        <svg class="ic-moon" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="bottomnav" id="bottomnav">
  <button data-tab="home" class="nav-btn active" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    <span>Home</span>
  </button>
  <button data-tab="exercises" class="nav-btn" aria-label="Exercises">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
    <span>Library</span>
  </button>
  <button class="nav-fab" id="nav-fab" title="Start today's workout" aria-label="Start today's workout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 5.5v13l11-6.5z" fill="currentColor" stroke="none"/></svg>
  </button>
  <button data-tab="history" class="nav-btn" aria-label="History">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
    <span>History</span>
  </button>
  <button data-tab="goals" class="nav-btn" aria-label="Goals">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
    <span>Goals</span>
  </button>
</nav>

<div id="modal-root"></div>
<div id="restpill-root"></div>
<div id="toast-root" class="toast-root"></div>

<script src="./data/exercises-chest.js"></script>
<script src="./data/exercises-back.js"></script>
<script src="./data/exercises-legs.js"></script>
<script src="./data/exercises-shoulders.js"></script>
<script src="./data/exercises-arms.js"></script>
<script src="./data/exercises-core.js"></script>
<script src="./data/exercises-cardio.js"></script>
<script src="./js/store.js"></script>
<script src="./js/app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
