<!doctype html>
<meta charset="utf-8">
<title>back SVG preview</title>
<style>
  body{background:#0f172a;color:#e2e8f0;font:14px sans-serif;display:flex;gap:16px;flex-wrap:wrap;padding:16px}
  .card{width:300px;border:1px solid #334155;border-radius:8px;padding:8px}
  svg{width:100%;height:auto;background:#1e293b;border-radius:6px}
</style>
<body>
<script src="data/exercises-back.js"></script>
<script>
  const ids = ["back-iso-lateral-front-lat-pulldown","back-iso-lateral-high-row","back-t-bar-row"];
  for (const id of ids) {
    const ex = window.GYM_EXERCISES.find(e => e.id === id);
    const d = document.createElement("div");
    d.className = "card";
    d.innerHTML = "<h3>" + ex.name + "</h3>" + ex.svg;
    document.body.appendChild(d);
  }
</script>
</body>
